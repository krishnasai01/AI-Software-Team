# Merge policy for this product, read by the platform from the default branch. You own this file
# (see CODEOWNERS); agents cannot change it. Anything omitted uses the platform defaults in
# orchestrator/policy.py. Paths listed here always need your approval, at every autonomy level.
sensitive_paths:
  - ".agent-company/**"
  - ".github/**"
  - "infra/**"
  - "docs/brain/**"
  - "CLAUDE.md"
  - "CODEOWNERS"
  - "**/auth/**"
  - "**/billing/**"
  - "**/payments/**"
  - "**/migrations/**"
  - "**/*.sql"
  # Add this product's own: anything handling money, credentials, personal data, or deletes.

auto_merge:
  level_1: {max_changed_lines: 50, max_files: 10, only_paths: ["**/*.md", "docs/**", "tests/**", "**/test_*"]}
  level_2: {max_changed_lines: 300, max_files: 15}
