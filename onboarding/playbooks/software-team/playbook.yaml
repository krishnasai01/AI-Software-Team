name: software-team
title: AI software team
intro: |
  This sets up the always-on software team (engineer, reviewer and tech lead agents, coordinated through
  GitHub): two servers, three GitHub Apps, encrypted secrets, the two stacks, then your repos, starting
  with a scratch repo for a $0 rehearsal. Plan on a couple of hours the first time.
  Every change is shown to you first and waits for your yes. Design: docs/design-v2.md.
guide: |
  This is the autonomy-first software team described in docs/design-v2.md. Each product repo starts at
  autonomy level 0 (shadow mode): the operator approves every merge while the platform builds a track
  record, and it proposes promotions later. Say so if the operator worries that agents can merge on their own.
  The rehearsal uses a scripted agent that makes no model calls, so it costs nothing.
  The GitHub Apps are created in the operator's browser; everything after that is automated or checked.
  Sensitive things stay with the operator by design: prompts, the policy, CI, infra, autonomy promotions.
finish: |
  The team is running. What to do now:
  1. Label 10 small, well-specified issues `agent-ready` on your product repo.
  2. Watch Slack (or the logs), the daily digest, and `python -m orchestrator.admin status`.
  3. Tune agents/*/prompt.md from the failures, then rebuild the sandbox images (sandbox-images/build.sh).
  4. When the track record supports it, the platform proposes a promotion to level 1. You approve it with
     `python -m orchestrator.admin approve <id>`.
  Pause everything at any time with `python -m orchestrator.admin pause`.

inputs:
  operator_login:
    prompt: Your GitHub login
    help: You become the trusted labeler and the approver of everything the team does.
    pattern: '[A-Za-z0-9](?:[A-Za-z0-9-]{0,38})'
  extra_approvers:
    prompt: Other people whose approvals count (GitHub logins, comma-separated)
    optional: true
    pattern: '[A-Za-z0-9-]+(?:\s*,\s*[A-Za-z0-9-]+)*'
  timezone:
    prompt: Timezone for the daily digest
    optional: true
    default: America/Chicago
    pattern: '[A-Za-z_]+(?:/[A-Za-z0-9_+-]+)*'
  slack_bot_token:
    prompt: Slack bot token
    kind: secret
    persist: false
    optional: true
    help: Approvals and alerts go to Slack. Without a token they go to the logs instead; you can add it later.
  slack_channel:
    prompt: Slack channel
    optional: true
    pattern: '#?[a-z0-9_-]+'
  control_host:
    prompt: Control server
    help: >-
      An ssh destination such as deploy@10.0.0.1, or `local` if the control server is this machine.
      It runs Postgres, the reconciler and the webhook receiver.
    pattern: 'local|(?:[A-Za-z0-9_][A-Za-z0-9_.-]*@)?[A-Za-z0-9][A-Za-z0-9.-]*'
  worker_host:
    prompt: Worker server
    help: >-
      An ssh destination such as deploy@10.0.0.2, or `local`. It runs the sandboxes, so it needs the most CPU.
      It may be the same machine as the control server for a small start.
    pattern: 'local|(?:[A-Za-z0-9_][A-Za-z0-9_.-]*@)?[A-Za-z0-9][A-Za-z0-9.-]*'
  control_private_ip:
    prompt: Control server's address on the private network
    help: The Tailscale or WireGuard address, for example 10.0.0.1. The servers reach each other there.
    pattern: '(?:\d{1,3}\.){3}\d{1,3}'
  worker_private_ip:
    prompt: Worker server's address on the private network
    pattern: '(?:\d{1,3}\.){3}\d{1,3}'
  sandbox_runtime:
    prompt: Sandbox runtime
    kind: choice
    options: [runsc, runc]
    default: runsc
    help: runsc is gVisor, the second wall around agent-written code. Use runc only on a development machine.
  deploy_dir:
    prompt: Where the platform lives on the servers
    default: /opt/agent-company
    pattern: '/[A-Za-z0-9_./-]+'
  platform_repo_url:
    prompt: Git URL of this platform repo (the servers clone it)
    help: Credentials are never taken from a remote URL. A private repo needs a deploy key on each server.
    suggest: [{cmd: [git, remote, get-url, origin]}]
    pattern: '(?:https://|git@)[A-Za-z0-9._~:/@-]+'
  platform_ref:
    prompt: Branch or tag the servers should run
    default: main
    suggest: [{cmd: [git, rev-parse, --abbrev-ref, HEAD]}]
    pattern: '[A-Za-z0-9._/-]+'
  public_hostname:
    prompt: Public hostname for GitHub's webhooks
    help: A DNS name that points at the control server, with ports 80 and 443 open. Caddy fetches the certificate.
    pattern: '[A-Za-z0-9](?:[A-Za-z0-9-]*[A-Za-z0-9])?(?:\.[A-Za-z0-9](?:[A-Za-z0-9-]*[A-Za-z0-9])?)+'
  anthropic_api_key:
    prompt: Anthropic API key
    kind: secret
    persist: false
    pattern: 'sk-ant-\S+'
    help: Only the model proxy on the worker ever holds it. Agents get short-lived per-run keys.
  postgres_password: {prompt: Postgres password, kind: secret, generate: true}
  litellm_master_key: {prompt: Model proxy master key, kind: secret, generate: true}
  webhook_secret: {prompt: Webhook secret, kind: secret, generate: true}
  github_token:
    prompt: GitHub token
    kind: secret
    persist: false
    suggest: [{env: GITHUB_TOKEN}, {cmd: [gh, auth, token]}]
    help: >-
      Your own token, used only to set up repos before the Apps exist. Kept in memory and forgotten when this
      ends. Classic scope `repo`, or a fine-grained token with Administration, Contents, Issues and
      Pull requests: write.
  orchestrator_app_id: {prompt: Orchestrator App ID, pattern: '\d+'}
  orchestrator_pem:
    prompt: Path to the orchestrator App's private key (.pem) on this machine
    pattern: '[^\s''"]+'
  engineer_app_id: {prompt: Engineer App ID, pattern: '\d+'}
  engineer_pem:
    prompt: Path to the engineer App's private key (.pem) on this machine
    pattern: '[^\s''"]+'
  reviewer_app_id: {prompt: Reviewer App ID, pattern: '\d+'}
  reviewer_pem:
    prompt: Path to the reviewer App's private key (.pem) on this machine
    pattern: '[^\s''"]+'
  worker_id: {prompt: Worker name, optional: true, default: worker-1, pattern: '[A-Za-z0-9._-]+'}
  max_sandboxes: {prompt: Sandboxes at once, optional: true, default: '4', pattern: '\d+'}

targets:
  scratch:
    title: scratch repo
    min: 1
    max: 1
    default_name: scratch
    inputs:
      repo:
        prompt: Scratch repo (owner/name)
        help: An empty throwaway repo with a README, for the rehearsal. Create it on GitHub first.
        pattern: '[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+'
      image: {prompt: Sandbox image, optional: true, default: 'agent-company/sandbox-rehearsal:latest'}
      ci_checks:
        prompt: Required CI check names (comma-separated)
        optional: true
        help: The scratch repo has no CI, so leave this empty.
  product:
    title: product repo
    min: 1
    inputs:
      repo:
        prompt: Product repo (owner/name)
        pattern: '[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+'
      image:
        prompt: Sandbox image for this product
        kind: choice
        options: ['agent-company/sandbox-python:latest', 'agent-company/sandbox-node:latest']
        help: The stack the agents build and test in. Add your own under sandbox-images/ for anything else.
      ci_checks:
        prompt: Required CI check names (comma-separated)
        optional: true
        help: >-
          The names of your CI checks as GitHub shows them, for example `test, lint`. GitHub then refuses to
          merge unless they pass. Leave empty only if the repo has no CI yet.

steps:
  - id: operator
    title: About you
    why: Who may hand work to the agents and approve their changes, and where alerts go.
    inputs: [operator_login, extra_approvers, timezone, slack_channel]

  - id: servers
    title: The two servers
    why: >-
      The control server runs the state and the reconciler; the worker runs the sandboxes. They talk over a
      private network, and only webhook delivery is public.
    needs: [operator]
    inputs: [control_host, worker_host, control_private_ip, worker_private_ip, sandbox_runtime, deploy_dir]
    detect:
      - {probe: ssh_ok, args: {host: '{control_host}'}}
      - {probe: ssh_ok, args: {host: '{worker_host}'}}
      - {probe: docker_ok, args: {host: '{control_host}'}}
      - {probe: docker_ok, args: {host: '{worker_host}'}}
    manual: |
      Provision two Linux servers (about 4 vCPU / 16 GB control, 8 vCPU / 32 GB worker) on a private network
      such as Tailscale or WireGuard. Use ssh keys only. Open ports 80 and 443 on the control server and
      nothing else to the public. Install Docker with the compose plugin on both, and let your ssh user run
      docker (the docker group). Then run `ssh <host>` once from here so its host key is accepted.

  - id: tools
    title: sops and age
    why: Secrets are kept only encrypted. sops and age encrypt them here and decrypt them on the servers.
    needs: [servers]
    inputs: [control_host, worker_host]
    detect:
      - {probe: commands, args: {host: local, names: [sops, age-keygen, git, ssh]}}
      - {probe: commands, args: {host: '{control_host}', names: [sops, age-keygen, git]}}
      - {probe: commands, args: {host: '{worker_host}', names: [sops, age-keygen, git]}}
    manual: |
      Install sops (https://github.com/getsops/sops/releases) and age (https://github.com/FiloSottile/age/releases)
      on this machine and on both servers, then ask me to check again.

  - id: gvisor
    title: gVisor on the worker
    why: Sandboxes run agent-written code under gVisor (runsc), a second wall around Docker.
    needs: [servers]
    when: {sandbox_runtime: runsc}
    inputs: [worker_host]
    detect:
      - {probe: docker_runtime, args: {host: '{worker_host}', runtime: runsc}}
    do:
      action: shell
      args:
        host: '{worker_host}'
        timeout: 900
        script: |
          set -euo pipefail
          S=""; [ "$(id -u)" = 0 ] || S="sudo -n"
          URL=https://storage.googleapis.com/gvisor/releases/release/latest/$(uname -m)
          cd "$(mktemp -d)"
          for f in runsc containerd-shim-runsc-v1; do
            curl -fsSLO "$URL/$f" -O "$URL/$f.sha512"
            sha512sum -c "$f.sha512"
          done
          chmod a+rx runsc containerd-shim-runsc-v1
          $S mv runsc containerd-shim-runsc-v1 /usr/local/bin
          $S /usr/local/bin/runsc install
          $S systemctl restart docker
          docker run --rm --runtime runsc hello-world >/dev/null
          echo "gVisor installed and working"
    manual: The installer needs passwordless sudo for your ssh user on the worker, and downloads gVisor from Google's release bucket, checking its checksums.

  - id: checkout
    title: The platform code on both servers
    why: The servers build and run the stacks from a checkout of this repo.
    needs: [servers]
    inputs: [control_host, worker_host, deploy_dir, platform_repo_url, platform_ref]
    detect:
      - {probe: path_exists, args: {host: '{control_host}', path: '{deploy_dir}/infra/control/docker-compose.yml'}}
      - {probe: path_exists, args: {host: '{worker_host}', path: '{deploy_dir}/infra/worker/docker-compose.yml'}}
    do:
      action: clone_platform
      args: {hosts: ['{control_host}', '{worker_host}'], dir: '{deploy_dir}', url: '{platform_repo_url}', ref: '{platform_ref}'}
    manual: If the repo is private, the servers need read access first (a deploy key), or clone it by hand and ask me to check again.

  - id: age-keys
    title: Encryption keys
    why: One age key for each machine that touches secrets (you, and each server), listed as recipients in .sops.yaml.
    needs: [tools, checkout]
    inputs: [control_host, worker_host]
    detect:
      - {probe: age_keys, args: {hosts: [local, '{control_host}', '{worker_host}']}}
    do:
      action: setup_age_keys
      args: {hosts: [local, '{control_host}', '{worker_host}']}

  - id: app-orchestrator
    title: GitHub App - orchestrator
    why: >-
      The orchestrator acts on GitHub as itself: labels, issues, checks, auto-merge and reverts. Each role
      has its own App with least privilege, so GitHub itself enforces who can do what.
    needs: [operator, servers]
    inputs: [orchestrator_app_id, orchestrator_pem, control_host, worker_host]
    detect:
      - {probe: github_app, args: {role: orchestrator, app_id: '{orchestrator_app_id}', pem: '{orchestrator_pem}'}}
      - {probe: app_key_installed, args: {role: orchestrator, hosts: ['{control_host}', '{worker_host}']}}
    do:
      action: install_app_key
      args: {role: orchestrator, pem: '{orchestrator_pem}', hosts: ['{control_host}', '{worker_host}']}
    manual: |
      In your browser: GitHub > Settings > Developer settings > GitHub Apps > New GitHub App.
        - Name: something like "<team>-orchestrator". Homepage URL: anything.
        - Webhook: Active, with the placeholder URL https://example.com (I set the real URL and secret later).
        - Repository permissions: Contents: write; Issues: write; Pull requests: write; Checks: write;
          Actions: write; Metadata: read. Nothing else.
        - Subscribe to events: Issues, Issue comment, Pull request, Pull request review, Check suite,
          Check run, Status.
        - Where can it be installed: only on this account.
      Create it, then note the App ID and click "Generate a private key" (a .pem downloads to this machine).
      Give me the App ID and the .pem path when I ask; I check the App and install the key on the servers.

  - id: app-engineer
    title: GitHub App - engineer
    why: The engineer opens pull requests. It can write code and PRs, and nothing else.
    needs: [operator, servers]
    inputs: [engineer_app_id, engineer_pem, control_host, worker_host]
    detect:
      - {probe: github_app, args: {role: engineer, app_id: '{engineer_app_id}', pem: '{engineer_pem}'}}
      - {probe: app_key_installed, args: {role: engineer, hosts: ['{control_host}', '{worker_host}']}}
    do:
      action: install_app_key
      args: {role: engineer, pem: '{engineer_pem}', hosts: ['{control_host}', '{worker_host}']}
    manual: |
      Create another GitHub App the same way: name "<team>-engineer", webhook not active, and
      Repository permissions: Contents: write; Pull requests: write; Metadata: read. No events.
      Then give me its App ID and .pem path.

  - id: app-reviewer
    title: GitHub App - reviewer
    why: The reviewer posts reviews. It can read code and write PR reviews, so it can never push code.
    needs: [operator, servers]
    inputs: [reviewer_app_id, reviewer_pem, control_host, worker_host]
    detect:
      - {probe: github_app, args: {role: reviewer, app_id: '{reviewer_app_id}', pem: '{reviewer_pem}'}}
      - {probe: app_key_installed, args: {role: reviewer, hosts: ['{control_host}', '{worker_host}']}}
    do:
      action: install_app_key
      args: {role: reviewer, pem: '{reviewer_pem}', hosts: ['{control_host}', '{worker_host}']}
    manual: |
      Create the third GitHub App: name "<team>-reviewer", webhook not active, and
      Repository permissions: Contents: read; Pull requests: write; Metadata: read. No events.
      Then give me its App ID and .pem path.

  - id: webhook
    title: Webhook delivery
    why: >-
      GitHub tells the control server about issues, PRs and CI results. The reconciler also sweeps every
      five minutes, so a missed delivery only costs latency.
    needs: [app-orchestrator]
    inputs: [public_hostname, webhook_secret, orchestrator_app_id, orchestrator_pem]
    detect:
      - {probe: webhook_config, args: {app_id: '{orchestrator_app_id}', pem: '{orchestrator_pem}', url: 'https://{public_hostname}/webhooks/github'}}
    do:
      action: set_webhook
      args: {app_id: '{orchestrator_app_id}', pem: '{orchestrator_pem}', url: 'https://{public_hostname}/webhooks/github'}

  - id: secrets
    title: Encrypted secrets
    why: >-
      control.enc.env and worker.enc.env hold every secret the stacks need, encrypted with sops. Only the
      worker gets the Anthropic key. They are never committed (the repo ignores *.env).
    needs: [age-keys, webhook, app-engineer, app-reviewer]
    inputs: [anthropic_api_key, slack_bot_token, postgres_password, litellm_master_key, webhook_secret, worker_id, max_sandboxes, control_host, worker_host, deploy_dir]
    detect:
      - {probe: sops_keys, args: {name: control}}
      - {probe: sops_keys, args: {name: worker}}
      - {probe: path_exists, args: {host: '{control_host}', path: '{deploy_dir}/infra/secrets/control.enc.env'}}
      - {probe: path_exists, args: {host: '{worker_host}', path: '{deploy_dir}/infra/secrets/worker.enc.env'}}
    do:
      action: write_secrets
      args: {control_host: '{control_host}', worker_host: '{worker_host}', deploy_dir: '{deploy_dir}'}

  - id: images
    title: Sandbox images
    why: Every agent run starts in a fresh container from one of these images, built on the worker.
    needs: [checkout, gvisor]
    inputs: [worker_host, deploy_dir]
    detect:
      - probe: docker_images
        args:
          host: '{worker_host}'
          images:
            - agent-company/sandbox-base:latest
            - agent-company/sandbox-python:latest
            - agent-company/sandbox-node:latest
            - agent-company/sandbox-rehearsal:latest
    do:
      action: shell
      args: {host: '{worker_host}', timeout: 3600, script: 'cd {deploy_dir} && sandbox-images/build.sh'}

  - id: stacks
    title: Start the stacks
    why: Brings up Postgres, the webhook receiver and the reconciler (control), and the model proxy, egress proxy and job runner (worker).
    needs: [secrets, images]
    inputs: [control_host, worker_host, deploy_dir, public_hostname]
    detect:
      - {probe: containers_up, args: {host: '{control_host}', project: agent-company-control, services: [postgres, webhook, reconciler, caddy]}}
      - {probe: containers_up, args: {host: '{worker_host}', project: agent-company-worker, services: [litellm, egress, agents-worker]}}
      - {probe: http_status, args: {url: 'https://{public_hostname}/webhooks/github', expect: [405]}}
    do:
      action: compose_up
      args: {control_host: '{control_host}', worker_host: '{worker_host}', dir: '{deploy_dir}'}
    manual: If the last check fails right after start, Caddy may still be getting its certificate, or DNS for the public hostname does not point at the control server yet.

  - id: database
    title: Database migrations
    why: The schema must be current before any product is registered.
    needs: [stacks]
    inputs: [control_host, deploy_dir]
    detect:
      - {probe: db_migrated, args: {host: '{control_host}'}}
    do:
      action: run_migrations
      args: {host: '{control_host}', dir: '{deploy_dir}'}

  - id: scratch-repo
    title: A scratch repo for the rehearsal
    why: >-
      A throwaway repo where a scripted agent (no model calls, no cost) walks the whole path:
      ticket, PR, review, policy check, merge. Do this before trusting a real product to the team.
    needs: [database]
    collect: scratch
    optional: true

  - id: repo-access
    title: Access to {repo}
    why: Your own token sets the repo up, and all three Apps must be installed on it.
    per: [scratch, product]
    needs: [app-orchestrator, app-engineer, app-reviewer, scratch-repo]
    inputs: [repo, github_token, orchestrator_app_id, orchestrator_pem, engineer_app_id, engineer_pem, reviewer_app_id, reviewer_pem]
    detect:
      - {probe: repo_access, args: {repo: '{repo}'}}
      - probe: apps_installed
        args:
          repo: '{repo}'
          apps:
            - {role: orchestrator, app_id: '{orchestrator_app_id}', pem: '{orchestrator_pem}'}
            - {role: engineer, app_id: '{engineer_app_id}', pem: '{engineer_pem}'}
            - {role: reviewer, app_id: '{reviewer_app_id}', pem: '{reviewer_pem}'}
    manual: |
      Install all three Apps on {repo} in your browser (the links are in the status above).
      Your GitHub token needs admin on the repo, to set its protection up.

  - id: repo-brain
    title: Product brain and policy on {repo}
    why: >-
      Every agent reads docs/brain and CLAUDE.md. .agent-company/policy.yaml decides what may ever merge
      without you, and CODEOWNERS lists the sensitive paths that always need you.
    per: [scratch, product]
    needs: [repo-access]
    inputs: [repo, github_token, operator_login]
    detect:
      - {probe: file_on_branch, args: {repo: '{repo}', path: .agent-company/policy.yaml}}
    do:
      action: open_brain_pr
      args: {repo: '{repo}', login: '{operator_login}'}
    manual: |
      After the pull request is open: review policy.yaml and CODEOWNERS for this product, fill in docs/brain/*,
      and merge it yourself. This comes before branch protection, which would otherwise block your own merge.

  - id: repo-settings
    title: Auto-merge settings on {repo}
    why: Auto-merge and automatic branch cleanup must be allowed for the platform to merge anything on its own.
    per: [scratch, product]
    needs: [repo-access]
    inputs: [repo, github_token]
    detect:
      - {probe: repo_settings, args: {repo: '{repo}', want: {allow_auto_merge: true, delete_branch_on_merge: true}}}
    do:
      action: set_repo_settings
      args: {repo: '{repo}', settings: {allow_auto_merge: true, delete_branch_on_merge: true}}

  - id: repo-ruleset
    title: Branch protection on {repo}
    why: >-
      The ruleset is what makes autonomy safe: nothing merges unless the platform's policy check (set only by
      the orchestrator) and CI pass, and sensitive paths need you. The reconciler re-verifies it every few
      minutes and stops merging if it drifts.
    per: [scratch, product]
    needs: [repo-brain, repo-settings]
    inputs: [repo, github_token, ci_checks, orchestrator_app_id]
    detect:
      - {probe: ruleset_ok, args: {repo: '{repo}', app_id: '{orchestrator_app_id}'}}
    do:
      action: create_ruleset
      args: {repo: '{repo}', app_id: '{orchestrator_app_id}', ci_checks: '{ci_checks}'}
    manual: Rulesets need a public repo, or GitHub Pro, Team or Enterprise for a private one.

  - id: repo-register
    title: Register {repo} with the team
    why: Tells the platform to watch this repo. It starts at autonomy level 0 (shadow mode), where you approve every merge.
    per: [scratch, product]
    needs: [repo-ruleset, database]
    inputs: [repo, image, control_host, deploy_dir]
    detect:
      - {probe: product_registered, args: {host: '{control_host}', name: '{target}', repo: '{repo}', image: '{image}'}}
    do:
      action: add_product
      args: {host: '{control_host}', dir: '{deploy_dir}', name: '{target}', repo: '{repo}', image: '{image}'}

  - id: rehearsal
    title: Rehearsal on {repo}
    why: A scripted agent walks the whole path for $0, so you see it work before any model is involved.
    per: [scratch]
    needs: [repo-register, images, stacks]
    inputs: [repo, github_token]
    detect:
      - {probe: rehearsal, args: {repo: '{repo}'}}
    do:
      action: create_rehearsal_issue
      args: {repo: '{repo}'}
    manual: |
      After the issue is created, expect a pull request from the engineer App and an approval from the reviewer
      App, then a pending agent-company/policy check (the product is at level 0). Approve and merge the PR
      yourself; this step is done when it has merged.

  - id: rehearsal-safety
    title: Safety checks on {repo}
    why: Break it on purpose, once, so you know the guardrails hold before you rely on them.
    per: [scratch]
    needs: [rehearsal]
    ack: true
    optional: true
    manual: |
      Try each of these on {repo}:
        1. Label an issue agent-ready from an account that is not a trusted labeler: it must be refused.
        2. Run `python -m orchestrator.admin pause`: new work must stop. Then `resume`.
        3. Set the repo to level 1 (`admin set-level {target} 1`) and push a commit that breaks CI on main right
           after an auto-merge: it must be reverted automatically and the product demoted.

  - id: product-repo
    title: Your real product
    why: The repo you want the team to work on. It gets the same setup as the scratch repo, and starts at level 0.
    needs: [database, scratch-repo, rehearsal, rehearsal-safety]
    collect: product
