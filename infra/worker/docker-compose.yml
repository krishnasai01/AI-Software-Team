# Worker server: agent workers, the model proxy and the egress proxy. Sandboxes are started by
# the agents worker on `sandbox-net`, which has no route out except through these two proxies.
#   sops exec-env ../secrets/worker.enc.env 'docker compose up -d'
name: agent-company-worker

services:
  litellm:
    image: ghcr.io/berriai/litellm:${LITELLM_VERSION:-main-stable}
    restart: unless-stopped
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}           # the only place the real key lives
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      DATABASE_URL: postgresql://agent:${POSTGRES_PASSWORD}@${CONTROL_PRIVATE_IP}:5432/litellm
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_HOST: ${LANGFUSE_URL:-}
    volumes: ["./litellm.yaml:/app/config.yaml:ro"]
    networks: [default, sandbox-net]
    ports: ["${PRIVATE_IP}:4000:4000"]   # control server's ask_model() and key minting

  egress:
    image: ubuntu/squid:${SQUID_VERSION:-6.6-24.04_beta}
    restart: unless-stopped
    volumes: ["./squid.conf:/etc/squid/squid.conf:ro"]
    networks: [default, sandbox-net]

  agents-worker:
    image: agent-company/platform:latest
    build: {context: ../.., dockerfile: infra/platform.Dockerfile}
    restart: unless-stopped
    command: ["python", "-m", "orchestrator.worker", "agents"]
    environment:
      DATABASE_URL: postgresql://agent:${POSTGRES_PASSWORD}@${CONTROL_PRIVATE_IP}:5432/agent_company
      TEMPORAL_ADDRESS: ${CONTROL_PRIVATE_IP}:7233
      GITHUB_APP_IDS: ${GITHUB_APP_IDS}
      LITELLM_URL: http://litellm:4000
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      SANDBOX_LITELLM_URL: http://litellm:4000
      SANDBOX_EGRESS_PROXY: http://egress:3128
      SANDBOX_NETWORK: sandbox-net
      SANDBOX_RUNTIME: ${SANDBOX_RUNTIME:-runsc}
      MAX_SANDBOXES: ${MAX_SANDBOXES:-4}
      LANGFUSE_URL: ${LANGFUSE_URL:-}
    volumes:
      # The worker starts sibling sandbox containers. This socket is root-equivalent on the worker
      # host; the worker runs only our code, never agent code.
      - /var/run/docker.sock:/var/run/docker.sock
      - ${GITHUB_APP_KEY_DIR:-/etc/agent-company/github-apps}:/run/secrets/github-apps:ro

networks:
  sandbox-net:
    name: sandbox-net
    internal: true   # no default route: sandboxes reach only litellm and egress
