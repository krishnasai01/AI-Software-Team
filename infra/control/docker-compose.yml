# Control server: state, the reconciler, and the webhook receiver. Admin ports bind to the private
# network only; Caddy exposes nothing but webhook delivery.
#   sops exec-env ../secrets/control.enc.env 'docker compose up -d --build'
name: agent-company-control

x-platform: &platform
  image: agent-company/platform:latest
  build: {context: ../.., dockerfile: infra/platform.Dockerfile}
  restart: unless-stopped
  environment:
    DATABASE_URL: postgresql://agent:${POSTGRES_PASSWORD}@postgres:5432/agent_company
    GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET}
    GITHUB_APP_IDS: ${GITHUB_APP_IDS}
    TRUSTED_LABELERS: ${TRUSTED_LABELERS}
    HUMAN_APPROVERS: ${HUMAN_APPROVERS}
    SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN}
    SLACK_CHANNEL: ${SLACK_CHANNEL}
    LITELLM_URL: http://${WORKER_PRIVATE_IP}:4000
    LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
    LANGFUSE_URL: ${LANGFUSE_URL:-}
    TEAM_DAILY_CEILING_USD: ${TEAM_DAILY_CEILING_USD:-250}
    TIMEZONE: ${TIMEZONE:-America/Chicago}
  volumes:
    - ${GITHUB_APP_KEY_DIR:-/etc/agent-company/github-apps}:/run/secrets/github-apps:ro
  depends_on:
    migrate: {condition: service_completed_successfully}

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: agent_company
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    ports: ["${PRIVATE_IP}:5432:5432"]   # worker server (jobs, LiteLLM keys) and backups
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "agent", "-d", "agent_company"]
      interval: 5s
      retries: 20

  migrate:
    image: agent-company/platform:latest
    build: {context: ../.., dockerfile: infra/platform.Dockerfile}
    command: ["python", "-m", "db.migrate"]
    environment:
      DATABASE_URL: postgresql://agent:${POSTGRES_PASSWORD}@postgres:5432/agent_company
    depends_on:
      postgres: {condition: service_healthy}

  webhook:
    <<: *platform
    command: ["uvicorn", "orchestrator.webhooks.app:app", "--host", "0.0.0.0", "--port", "8000"]

  reconciler:
    <<: *platform
    command: ["python", "-m", "orchestrator.reconciler"]

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]   # the only public ports: webhook delivery
    environment:
      PUBLIC_HOSTNAME: ${PUBLIC_HOSTNAME}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy:/data

volumes:
  postgres:
  caddy:
