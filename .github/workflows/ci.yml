name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: {POSTGRES_USER: agent, POSTGRES_PASSWORD: agent, POSTGRES_DB: agent_test}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U agent" --health-interval 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://agent:agent@localhost:5432/agent_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run ruff check . && uv run ruff format --check .
      - run: docker build -q -f sandbox-images/base/Dockerfile -t agent-company/sandbox-base:test .
      - run: >-
          docker build -q --build-arg BASE=agent-company/sandbox-base:test
          -t agent-company/sandbox-rehearsal:test sandbox-images/rehearsal
      - run: uv run pytest -q
