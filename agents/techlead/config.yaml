role: techlead
model: claude-opus-5-5
tools: [Read, Glob, Grep, Bash]
max_turns: 60
max_budget_usd_per_run: 5
run_timeout_minutes: 30
output_schema:
  type: object
  required: [decision, guidance, sub_tickets, question, risk_flag]
  properties:
    decision:
      type: string
      enum: [answer, split, ask_human, side_with_reviewer, side_with_engineer]
    guidance: {type: string, description: "Your answer, ruling or rationale, written for the engineer"}
    sub_tickets:
      type: array
      description: "For split and breakdown: each about a day of work, with acceptance criteria"
      items:
        type: object
        required: [title, body]
        properties: {title: {type: string}, body: {type: string}}
    question:
      type: object
      description: "For ask_human only; otherwise empty strings and lists"
      required: [question, options, default, reversible]
      properties:
        question: {type: string}
        options: {type: array, items: {type: string}}
        default: {type: string, description: "What you would do if nobody answers; empty if none"}
        reversible: {type: boolean, description: "True only if acting on the default is easy to undo later"}
    risk_flag: {type: string, enum: [none, product, security]}
